name: build

# Real matrix build across all three target OSes on every push/PR. This is
# the automatable slice of M6 ("cross-platform verification") from the
# plan: it proves the app actually compiles and packages with each
# platform's real toolchain (catching missing platform-specific imports,
# wails packaging failures, per-OS go vet issues), which is meaningfully
# more than a single Linux dev machine can confirm alone. It does NOT
# replace a human clicking through the app on real Windows/macOS hardware
# -- that verification (documented as still outstanding) covers runtime
# behavior this can't: actual editor launch, no-elevation-prompt
# confirmation, and macOS multi-version install-path collisions.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install GTK/WebKitGTK dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: go vet
        run: go vet ./...

      # -tags integration hits the live GitHub API and downloads real Godot
      # releases, so it's intentionally not run on every push -- see README.
      - name: go test (offline)
        run: go test ./...

      - name: wails build (Linux)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41

      - name: wails build (macOS/Windows)
        if: runner.os != 'Linux'
        run: wails build
