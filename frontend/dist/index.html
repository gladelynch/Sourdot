<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge, Chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sourdot — Godot Version Manager</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
</head>

<body>
    <div class="app">
        <nav class="sidebar" aria-label="Primary">
            <div class="brand">
                <div class="brand-name">Sourdot</div>
                <div class="brand-tagline">Godot Version Manager</div>
            </div>
            <button class="nav-item is-active" data-view="versions" type="button">Versions</button>
            <button class="nav-item" data-view="projects" type="button">Projects</button>
            <div class="nav-spacer"></div>
            <button class="nav-item" data-view="settings" type="button">Settings</button>
        </nav>

        <main class="content">
            <section id="view-versions" class="view is-active" aria-labelledby="view-versions-heading">
                <header class="view-header">
                    <h1 id="view-versions-heading">Versions</h1>
                    <button class="btn btn-accent" id="browse-versions-btn" type="button">Browse available…</button>
                </header>

                <div id="install-progress" class="progress-banner" role="status" hidden>
                    <div class="progress-banner-label" id="install-progress-label">Installing…</div>
                    <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="install-progress-label">
                        <div class="progress-bar-fill" id="install-progress-fill"></div>
                    </div>
                </div>

                <div id="installed-versions-list">
                    <div class="empty-state">
                        <p>No Godot versions installed yet.</p>
                        <p class="muted">Click "Browse available…" to install one.</p>
                    </div>
                </div>
            </section>

            <div id="browse-panel" class="modal-overlay" hidden>
                <div class="modal" role="dialog" aria-modal="true" aria-labelledby="browse-panel-heading">
                    <header class="modal-header">
                        <h2 id="browse-panel-heading">Browse available versions</h2>
                        <button class="btn btn-sm" id="browse-panel-close" type="button">Close</button>
                    </header>
                    <div id="available-versions-list" class="modal-body"></div>
                </div>
            </div>

            <section id="view-projects" class="view" aria-labelledby="view-projects-heading" hidden>
                <header class="view-header">
                    <h1 id="view-projects-heading">Projects</h1>
                    <button class="btn btn-accent" id="add-project-btn" type="button">Add project…</button>
                </header>
                <div id="projects-list">
                    <div class="empty-state">
                        <p>No projects tracked yet.</p>
                        <p class="muted">Click "Add project…" to track one.</p>
                    </div>
                </div>
            </section>

            <section id="view-settings" class="view" aria-labelledby="view-settings-heading" hidden>
                <header class="view-header">
                    <h1 id="view-settings-heading">Settings</h1>
                </header>

                <div class="settings-panel">
                    <div class="settings-field">
                        <label for="default-version-select">Default version for unpinned projects</label>
                        <select id="default-version-select"></select>
                    </div>

                    <div class="settings-field">
                        <label for="github-token-input">GitHub personal access token (optional)</label>
                        <div class="settings-field-row">
                            <input id="github-token-input" type="password" autocomplete="off" placeholder="Raises the 60/hr unauthenticated rate limit" />
                            <button id="github-token-save" class="btn btn-sm" type="button">Save</button>
                        </div>
                    </div>

                    <div class="settings-field">
                        <span class="settings-field-label" id="data-dir-label">Data directory</span>
                        <div class="settings-field-row">
                            <code id="data-dir-value" class="muted" aria-labelledby="data-dir-label">—</code>
                            <button id="reveal-data-dir-btn" class="btn btn-sm" type="button">Reveal</button>
                        </div>
                    </div>
                </div>

                <div class="settings-panel">
                    <dl class="about-list">
                        <dt>Backend status</dt>
                        <dd id="backend-status">checking…</dd>
                        <dt>App version</dt>
                        <dd id="app-version">—</dd>
                    </dl>
                </div>
            </section>
        </main>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/events.js"></script>
    <script src="js/views/versions.js"></script>
    <script src="js/views/projects.js"></script>
    <script src="js/views/settings.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
